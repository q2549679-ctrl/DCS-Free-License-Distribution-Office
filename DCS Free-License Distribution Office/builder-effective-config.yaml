directories:
  output: release
  buildResources: build
appId: com.dcs.trialmanager
productName: DCS-FLDO
compression: maximum
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - ico/**/*
      - node_modules/better-sqlite3/**/*
win:
  icon: ico/DCS-FlDO.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: DCS 白嫖许可证发放处
  artifactName: DCS-FLDO-Setup-${version}.${ext}
portable:
  artifactName: DCS-FLDO-${version}-Portable.${ext}
electronVersion: 44.0.0
